<ion-header>
  <ion-toolbar><ion-title>Films</ion-title></ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (m of movies; track m.id) {
      <ion-item>
        <ion-thumbnail slot="start"><img [src]="m.poster" /></ion-thumbnail>
        <ion-label>
          <h2>{{ m.title }}</h2>
          <p>{{ m.year }}</p>
        </ion-label>
        <ion-button fill="clear" slot="end" (click)="toggle(m)">
          <ion-icon slot="icon-only" [name]="favIds.has(m.id) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
