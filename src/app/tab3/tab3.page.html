
<ion-header>
  <ion-toolbar>
    <ion-title>Matching</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (matches.length === 0) {
    <p class="ion-padding">
      Aucun utilisateur au-dessus de 75 % de compatibilité.
    </p>
  } @else {
    <ion-list>
      @for (u of matches; track u.nom + u.prenom) {
        <ion-item>
          <ion-avatar slot="start">
            <img
              [src]="u.photo || 'https://ionicframework.com/docs/img/demos/avatar.svg'"
              [alt]="u.prenom + ' ' + u.nom"
            />
          </ion-avatar>

          <ion-label>
            {{ u.prenom }} {{ u.nom }}
          </ion-label>

          <ion-badge slot="end" color="success">
            {{ u.score }} %
          </ion-badge>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
